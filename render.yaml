services:
  - type: web
    name: tradeflow-pro
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIPANA_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: tradeflow-pro
          type: web
          property: host
